<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Background Container -->
  <rect width="400" height="120" rx="12" fill="#131D23"/>
  
  <!-- Architectural Mark Box -->
  <g transform="translate(20, 20)">
    <rect width="80" height="80" rx="6" fill="#45382F" stroke="#B78A55" stroke-width="2"/>
    <!-- Top-left corner bracket -->
    <path d="M 30 20 L 20 20 L 20 30" stroke="#B78A55" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Bottom-right corner bracket -->
    <path d="M 50 60 L 60 60 L 60 50" stroke="#9A6048" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- SIBC Monogram -->
    <text x="40" y="48" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#EDE3D3" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">SIBC</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(120, 48)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#EDE3D3" letter-spacing="2">SOUTH INDIA</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#B78A55" letter-spacing="3.5">CIVIL CONTRACTORS</text>
  </g>
</svg>
